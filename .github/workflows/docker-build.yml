name: Docker Build

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t urbanflow-api ./backend
