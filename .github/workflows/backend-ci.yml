name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install CBC solver (PuLP)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coinor-cbc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff httpx
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Import app
        run: python -c "from main import app; print(app.title)"
