[project]
name = "urbanflow-backend"
version = "1.0.0"
description = "UrbanFlow Valencia - API de predicción de tráfico y optimización urbana"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
